# Blueprint do Render: um serviço só (site + API + WebSocket). Os atletas ficam no Postgres (Neon), então não precisa de disco.
services:
  - type: web
    name: happy-hoops
    runtime: docker
    plan: starter          # o plano free dorme e derruba as salas ao vivo
    region: oregon         # troque para a região mais perto dos jogadores
    healthCheckPath: /api/health
    numInstances: 1        # as salas ficam na memória: nunca use mais de 1 instância
    autoDeploy: true
    envVars:
      - key: DATABASE_URL  # connection string do Neon (cole no painel do Render)
        sync: false
      - key: ADMIN_PASSWORD
        sync: false        # senha forte do /admin
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
