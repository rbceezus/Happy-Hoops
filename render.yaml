# Blueprint do Render: um serviço só (site + API + WebSocket) com disco persistente para o SQLite.
services:
  - type: web
    name: happy-hoops
    runtime: docker
    plan: starter          # disco persistente exige plano pago; o free dorme e perde salas/dados
    region: oregon         # troque para a região mais perto dos jogadores (ex.: ohio, virginia)
    healthCheckPath: /api/health
    numInstances: 1        # as salas ficam na memória: nunca use mais de 1 instância
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # você digita no painel do Render (senha forte)
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /app/data/happy-hoops.db
    disk:
      name: happy-hoops-data
      mountPath: /app/data
      sizeGB: 1
